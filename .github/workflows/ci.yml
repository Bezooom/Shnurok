name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: syntax check + ep0 protocol tests (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Syntax check (tools, console)
        run: make check
      - name: ep0 protocol contract tests
        run: make test
